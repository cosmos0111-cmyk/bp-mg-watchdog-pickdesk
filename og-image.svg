<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="458" cy="268" r="64" fill="#6d28d9" opacity="0.08"/>
    <circle cx="928" cy="552" r="79" fill="#6d28d9" opacity="0.17"/>
    <circle cx="349" cy="691" r="39" fill="#6d28d9" opacity="0.17"/>
    <circle cx="1215" cy="357" r="29" fill="#6d28d9" opacity="0.12"/>
    <circle cx="747" cy="217" r="66" fill="#6d28d9" opacity="0.06"/>
    <circle cx="1141" cy="654" r="59" fill="#6d28d9" opacity="0.17"/>
    <rect x="241" y="319" width="96" height="58" rx="8" fill="#7c3aed" opacity="0.05" transform="rotate(24, 101, 30)"/>
    <rect x="943" y="67" width="64" height="85" rx="8" fill="#7c3aed" opacity="0.10" transform="rotate(21, 1282, 45)"/>
    <rect x="876" y="507" width="94" height="58" rx="8" fill="#7c3aed" opacity="0.09" transform="rotate(35, 10, 447)"/>
    <rect x="851" y="507" width="43" height="63" rx="8" fill="#7c3aed" opacity="0.09" transform="rotate(41, 290, 235)"/>
    <rect x="599" y="654" width="62" height="91" rx="8" fill="#7c3aed" opacity="0.08" transform="rotate(16, 27, -75)"/>
    <rect x="253" y="54" width="88" height="97" rx="8" fill="#7c3aed" opacity="0.08" transform="rotate(2, 175, 92)"/>
    <rect x="146" y="323" width="36" height="30" rx="8" fill="#7c3aed" opacity="0.05" transform="rotate(14, 592, 654)"/>
    <rect x="1161" y="172" width="24" height="33" rx="8" fill="#7c3aed" opacity="0.03" transform="rotate(39, 165, 613)"/>
    <polygon points="-11,280 45,392 -67,392" fill="#6d28d9" opacity="0.06"/>
    <polygon points="14,288 39,338 -11,338" fill="#6d28d9" opacity="0.09"/>
    <polygon points="368,326 395,380 341,380" fill="#6d28d9" opacity="0.05"/>
    <polygon points="206,-130 239,-64 173,-64" fill="#6d28d9" opacity="0.06"/>

  <!-- Wave at bottom -->
  <path d="M0,560 C360,595 840,525 1200,560 L1200,630 L0,630Z" fill="#6d28d9" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 셔츠룸 예약 시 눈탱이 피하는 법
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
     — 소비자 보호 저널
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#f472b6" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
     마포 셔츠룸 예약 시 눈탱이 피하는 법 — 소비자 보호 저널
  </text>
</svg>